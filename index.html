          <svg viewBox="0 0 24 24" class="btn-ico" aria-hidden="true"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
          <span data-t="venue.mapsBtn"></span>
        </a>
      </div>
    </div>
  </section>

  <!-- ---------- GUEST INFO / DRESS CODE ---------- -->
  <section class="section" id="info" aria-labelledby="info-title">
    <div class="wrap">
      <p class="section-eyebrow reveal" data-t="info.eyebrow"></p>
      <h2 id="info-title" class="section-title reveal" data-t="info.title"></h2>

      <div class="info-grid">
        <article class="card reveal">
          <h3 class="card-title" data-t="info.dress.title"></h3>
          <p class="card-sub" data-t="info.dress.subtitle"></p>
          <p class="card-text" data-html="info.dress.textHtml"></p>
          <div class="swatches" id="swatches" aria-hidden="true"></div>
          <p class="card-fine" data-t="info.dress.note"></p>
        </article>

        <article class="card reveal">
          <h3 class="card-title" data-t="info.parking.title"></h3>
          <p class="card-sub" data-t="info.parking.subtitle"></p>
          <ul class="card-list" id="parkingList"></ul>
          <p class="card-fine" data-t="info.parking.note"></p>
        </article>
      </div>
    </div>
  </section>

  <!-- ---------- RSVP  (hidden entirely when WEDDING.rsvp.enabled === false) ---------- -->
  <section class="section section--tint" id="rsvp" aria-labelledby="rsvp-title">
    <div class="wrap wrap--narrow">
      <p class="section-eyebrow reveal" data-t="rsvp.eyebrow"></p>
      <h2 id="rsvp-title" class="section-title reveal" data-t="rsvp.title"></h2>
      <p class="section-sub reveal" data-t="rsvp.deadline"></p>

      <form class="rsvp-form reveal" id="rsvpForm" novalidate>
        <div class="field">
          <label for="guestName">
            <span data-t="rsvp.labels.name"></span> <span class="req">*</span><em data-t="rsvp.labels.nameEn"></em>
          </label>
          <input type="text" id="guestName" name="guestName" autocomplete="name" required
                 data-attr="placeholder:rsvp.labels.namePlaceholder" />
          <p class="err" data-err="guestName" data-t="rsvp.errors.name" hidden></p>
        </div>

        <fieldset class="field">
          <legend>
            <span data-t="rsvp.labels.attendance"></span> <span class="req">*</span><em data-t="rsvp.labels.attendanceEn"></em>
          </legend>
          <div class="choice-row" id="attendanceChoices"></div>
          <p class="err" data-err="attendance" data-t="rsvp.errors.attendance" hidden></p>
        </fieldset>

        <div id="attendingOnly" class="attending-only" hidden>
          <div class="field" id="fieldGuestCount">
            <label for="guestCount">
              <span data-t="rsvp.labels.guests"></span><em data-t="rsvp.labels.guestsEn"></em>
            </label>
            <div class="stepper">
              <button type="button" class="step-btn" id="stepMinus" aria-label="ลดจำนวน">&minus;</button>
              <input type="number" id="guestCount" name="guestCount" min="1" max="10" step="1" value="1" inputmode="numeric" />
              <button type="button" class="step-btn" id="stepPlus" aria-label="เพิ่มจำนวน">+</button>
            </div>
          </div>

          <fieldset class="field" id="fieldSlots">
            <legend>
              <span data-t="rsvp.labels.slot"></span><em data-t="rsvp.labels.slotEn"></em>
            </legend>
            <div class="choice-col" id="slotChoices"></div>
            <p class="err" data-err="slot" data-t="rsvp.errors.slot" hidden></p>
          </fieldset>
        </div>

        <div class="field" id="fieldWishes">
          <label for="wishes">
            <span data-t="rsvp.labels.wishes"></span><em data-t="rsvp.labels.wishesEn"></em>
          </label>
          <textarea id="wishes" name="wishes" rows="3" data-attr="placeholder:rsvp.labels.wishesPlaceholder"></textarea>
        </div>

        <button type="submit" class="btn btn--gold btn--block" id="rsvpSubmit" data-t="rsvp.labels.submit"></button>
        <p class="form-fine" data-t="rsvp.labels.privacy"></p>
      </form>

      <div class="rsvp-thanks" id="rsvpThanks" hidden>
        <svg viewBox="0 0 48 48" class="thanks-mark" aria-hidden="true"><circle cx="24" cy="24" r="21"/><path d="M15 24.5l6.5 6.5L33 19"/></svg>
        <h3 class="thanks-title" id="thanksTitle"></h3>
        <p class="thanks-text" id="thanksText"></p>
        <div class="btn-row">
          <button type="button" class="btn btn--ghost" id="copyRsvp" data-t="rsvp.thanks.copyBtn"></button>
          <button type="button" class="btn btn--ghost" id="editRsvp" data-t="rsvp.thanks.editBtn"></button>
        </div>
        <p class="form-fine" id="copyHint" aria-live="polite"></p>
      </div>
    </div>
  </section>

  <!-- ---------- FOOTER ---------- -->
  <footer class="footer">
    <div class="wrap">
      <div class="footer-mono reveal">
        <span class="mono-letter" data-t="monogram.left"></span><span class="mono-amp" data-t="monogram.amp"></span><span class="mono-letter" data-t="monogram.right"></span>
      </div>
      <p class="footer-th reveal" data-t="footer.th"></p>
      <p class="footer-en reveal" data-t="footer.en"></p>
      <p class="footer-date reveal" data-t="footer.date"></p>

      <!-- closing scene: the couple and their cats -->
      <div class="farewell reveal" id="farewell" role="img" data-attr="aria-label:footer.sceneAlt">
        <svg class="fw-svg" viewBox="42 48 316 138" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- cuts the leaning figures off flat along the ground -->
            <clipPath id="fwGround"><rect x="0" y="0" width="400" height="173.5"/></clipPath>
          </defs>
          <ellipse class="shadow" cx="172" cy="173" rx="24" ry="4"/>
          <ellipse class="shadow" cx="212" cy="173" rx="26" ry="4"/>
          <ellipse class="shadow" cx="150" cy="174" rx="14" ry="3"/>
          <ellipse class="shadow" cx="243" cy="174" rx="14" ry="3"/>
          <path class="ground" d="M84 174 H316"/>

          <g class="fw-spark-fill">
            <path class="spark" d="M128 108 l2.6 5.4 5.4 2.6 -5.4 2.6 -2.6 5.4 -2.6 -5.4 -5.4 -2.6 5.4 -2.6 Z"/>
            <path class="spark" d="M266 100 l2.2 4.6 4.6 2.2 -4.6 2.2 -2.2 4.6 -2.2 -4.6 -4.6 -2.2 4.6 -2.2 Z"/>
            <path class="spark" d="M192 58 l2.4 5 5 2.4 -5 2.4 -2.4 5 -2.4 -5 -5 -2.4 5 -2.4 Z"/>
          </g>

          <g clip-path="url(#fwGround)">

          <!-- groom -->
          <g class="sway">
            <g class="fig">
              <circle cx="172" cy="83" r="9"/>
              <path d="M163 81 C163.5 73.5 167.5 70.5 172 70.5 C176.5 70.5 180.5 73.5 181 81 C178.5 76.5 175.5 75 172 75 C168.5 75 165.5 76.5 163 81 Z"/>
              <path d="M161 101 c0 -5 5 -9 11 -9 c6 0 11 4 11 9 l1.5 30 h-25 Z"/>
              <path d="M160 103 l-4.5 27 4 1.5 5.5 -26 Z"/>
              <path d="M180.5 102 L190 128.5 L186 130.5 L176.5 104 Z"/>
              <path d="M161 131 h9.5 l-1 41 h-8 Z"/>
              <path d="M174 131 h9.5 l-1 41 h-8 Z"/>
              <path d="M159.5 170 h11 v3.4 h-11 Z"/>
              <path d="M172.5 170 h11 v3.4 h-11 Z"/>
            </g>
            <path class="accent" d="M172 95 v14"/>
          </g>

          <!-- bride -->
          <g class="sway sway--b">
            <g class="fig-2">
              <circle cx="212" cy="85" r="8.6"/>
              <path d="M203.6 83 C204 76 208 73 212 73 C216 73 220 76 220.4 83 C218 79 215 77.6 212 77.6 C209 77.6 206 79 203.6 83 Z"/>
              <circle cx="219.5" cy="80.5" r="4.6"/>
              <path d="M202 103 c0 -5 4.5 -9 10 -9 c5.5 0 10 4 10 9 l1.5 22 h-23 Z"/>
              <path d="M223 104 l4 25 -4 1.5 -5 -24 Z"/>
              <path d="M203 103 L195 128.5 L199 130.5 L207.5 105 Z"/>
              <path d="M200.5 125 h23 l7 47 h-37 Z"/>
            </g>
            <path class="accent" d="M206 97 l11 20"/>
            <path class="accent" d="M201.5 129 h22.5"/>
          </g>

          <!-- joined hands -->
          <path class="accent" d="M187.5 130.5 c2.5 3 5.5 3 8 0"/>

          <!-- cat leaning into the groom -->
          <g class="cat" transform="translate(150,173.5) rotate(9)">
            <path class="tail" d="M-8 -2 c-9 1 -13 -8 -10 -16 c1 -4 5 -5 6 -1 c1 3 -2 5 -3 3"
                  fill="none" stroke-width="3.4" stroke-linecap="round"/>
            <path d="M-8 0 c-5 -6 -4 -18 2 -24 c2 -2 4 -3 6 -3 c2 0 4 1 6 3 c6 6 7 18 2 24 Z"/>
            <path d="M-8.4 -2 h16.8 v11 h-16.8 Z"/>
            <circle cx="0" cy="-31" r="7.4"/>
            <path class="ear" d="M-6 -35 l-1.5 -8.5 6.5 4.5 Z"/>
            <path class="ear ear--b" d="M6 -35 l1.5 -8.5 -6.5 4.5 Z"/>
          </g>

          <!-- cat leaning into the bride -->
          <g class="cat-2" transform="translate(243,173.5) rotate(-10)">
            <path class="tail tail--b" d="M8 -2 c9 1 13 -8 10 -16 c-1 -4 -5 -5 -6 -1 c-1 3 2 5 3 3"
                  fill="none" stroke-width="3.4" stroke-linecap="round"/>
            <path d="M-8 0 c-5 -6 -4 -18 2 -24 c2 -2 4 -3 6 -3 c2 0 4 1 6 3 c6 6 7 18 2 24 Z"/>
            <path d="M-8.4 -2 h16.8 v11 h-16.8 Z"/>
            <circle cx="0" cy="-31" r="7.4"/>
            <path class="ear ear--b" d="M-6 -35 l-1.5 -8.5 6.5 4.5 Z"/>
            <path class="ear" d="M6 -35 l1.5 -8.5 -6.5 4.5 Z"/>
          </g>

          </g>
        </svg>
      </div>
    </div>
  </footer>
</main>
