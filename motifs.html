<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ลายไทย — เลือกแบบ</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ivory:#FDFBF7; --ink:#3B3A36; --gold:#D4AF37; --gold-deep:#A98A20; --dusty:#8A9EA7 }
  *{box-sizing:border-box}
  body{margin:0;padding:40px 24px 64px;background:var(--ivory);color:var(--ink);
       font-family:"Noto Sans Thai",sans-serif;font-weight:300}
  h1{font-family:"Cormorant Garamond",serif;font-weight:400;text-align:center;
     font-size:30px;letter-spacing:.06em;margin:0 0 6px}
  .sub{text-align:center;color:#6B6960;font-size:14px;margin:0 0 40px}
  .grid{display:grid;gap:22px;max-width:1120px;margin:0 auto;
        grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  .m{margin:0;background:#fff;border:1px solid rgba(138,158,167,.3);border-radius:4px;
     padding:18px 14px 14px;text-align:center}
  .art{display:flex;gap:8px;justify-content:center;align-items:center}
  .art svg{width:150px;height:150px}
  .motif path,.motif circle{fill:none;stroke:#2E3757;stroke-width:1.6;
     stroke-linejoin:round;stroke-linecap:round}
  .motif .fill{fill:#2E3757;stroke:none}
  .gold .motif path,.gold .motif circle{stroke:var(--gold)}
  .gold .motif .fill{fill:var(--gold)}
  .gold{background:linear-gradient(160deg,#F7F1E4,#EFE7D6);border-radius:3px;padding:2px}
  figcaption{margin-top:12px;font-size:13.5px;line-height:1.5}
  figcaption b{display:block;font-family:"Cormorant Garamond",serif;color:var(--gold-deep);
     font-size:15px;letter-spacing:.2em;margin-bottom:2px}
  figcaption em{display:block;font-family:"Cormorant Garamond",serif;font-style:italic;
     font-size:12px;color:#6B6960;margin-top:2px}
</style></head>
