<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Playfair+Display:wght@400;500&family=Trirong:wght@300;400&family=Noto+Sans+Thai:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden}
  body{background:linear-gradient(150deg,#FFFDF9 0%,#FDFBF7 45%,#F6F0E4 100%);
       display:flex;align-items:center;justify-content:center;position:relative}
  .og-grain{position:absolute;inset:0;opacity:.5;
    background-image:repeating-linear-gradient(58deg,rgba(138,158,167,.05) 0 1px,transparent 1px 5px),
                     repeating-linear-gradient(-58deg,rgba(212,175,55,.035) 0 1px,transparent 1px 7px)}
  .og-frame{position:absolute;inset:22px;border:1px solid rgba(212,175,55,.5)}
  .og-frame::after{content:"";position:absolute;inset:9px;border:1px solid rgba(212,175,55,.22)}
  .og-corner{position:absolute;width:76px;height:76px;fill:rgba(212,175,55,.8);
             stroke:rgba(212,175,55,.8);stroke-width:.6;overflow:visible}
  .og-corner .pf-l{fill:none;stroke:rgba(212,175,55,.7);stroke-width:1.6}
  .c-tl{top:12px;left:12px}.c-tr{top:12px;right:12px;transform:scaleX(-1)}
  .c-bl{bottom:12px;left:12px;transform:scaleY(-1)}.c-br{bottom:12px;right:12px;transform:scale(-1)}

  .og-wrap{display:flex;align-items:center;gap:36px;position:relative;z-index:2}
  .og-text{width:640px;text-align:center}
  .og-eyebrow{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:22px;
    letter-spacing:.34em;text-transform:uppercase;color:#96771A;margin:0}
  .og-name{font-family:"Great Vibes",cursive;font-size:118px;line-height:1.05;
    color:#6E838C;margin:14px 0 0}
  .og-name em{font-style:normal;color:#D4AF37;font-size:.74em}
  .og-name-th{font-family:"Trirong",serif;font-weight:300;font-size:40px;
    letter-spacing:.2em;color:#71806D;margin:6px 0 0}
  .og-div{display:flex;align-items:center;justify-content:center;gap:16px;margin:22px 0 0}
  .og-div span{height:1px;width:110px;background:linear-gradient(90deg,transparent,#D4AF37)}
  .og-div span:last-child{background:linear-gradient(90deg,#D4AF37,transparent)}
  .og-div svg{width:26px;height:14px;fill:none;stroke:#D4AF37;stroke-width:1}
  .og-div .fill{fill:#D4AF37;stroke:none}
  .og-date{font-family:"Trirong",serif;font-size:38px;letter-spacing:.05em;color:#3B3A36;margin:22px 0 0}
  .og-date-en{font-family:"Cormorant Garamond",serif;font-size:18px;letter-spacing:.13em;
    text-transform:uppercase;color:#A98A20;margin:8px 0 0;white-space:nowrap;
    font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
  .og-art{width:432px;height:372px;position:relative}
  .og-art svg{width:100%;height:100%}
  .og-art .rt-glow{animation:none;opacity:.85}
  .og-art .rc-unit,.og-art .rc-tailring,.og-art .malai,.og-art .rt-side{animation:none}
</style></head><body>

      <path fill="none" d="M3.2 -2.6 C5 -10 8.5 -18 14.5 -24.5"/>
    </g>

    <g id="m-flame" fill="none" stroke-linejoin="round" stroke-linecap="round">

    <g id="lotus">
      <path d="M0 0 C-8 -6 -11.5 -16 0 -31 C11.5 -16 8 -6 0 0 Z"/>
      <path fill="none" d="M0 -6 C-4.5 -12 -4.5 -19 0 -25 C4.5 -19 4.5 -12 0 -6 Z"/>
      <path fill="none" d="M-10 .5 C-5.5 -3 5.5 -3 10 .5"/>
    </g>
    <!-- temple spire -->
    <g id="spire" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-7 0 L7 0"/>
      <path d="M-5.5 0 L-4.6 -7 L-3.4 -20 L0 -33 L3.4 -20 L4.6 -7 L5.5 0 Z"/>
      <path d="M-3.6 -13 L3.6 -13"/>
      <circle cx="0" cy="-36.5" r="2.1"/>
      <path d="M0 -38.6 L0 -46"/>
    </g>

    <radialGradient id="waxGrad" cx="36%" cy="30%" r="76%">
      <stop offset="0%"   stop-color="#F6E5B0"/>
      <stop offset="40%"  stop-color="#DEBA4E"/>
      <stop offset="76%"  stop-color="#B8912A"/>
      <stop offset="100%" stop-color="#8A6912"/>
    </radialGradient>
    <linearGradient id="sunrise" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FDF8EC"/>
      <stop offset="32%"  stop-color="#F7E9C9"/>
      <stop offset="58%"  stop-color="#EEDDBE"/>
      <stop offset="80%"  stop-color="#D9DAD0"/>
      <stop offset="100%" stop-color="#BFCBC6"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="66%" r="42%">
      <stop offset="0%"   stop-color="#FFF0BE" stop-opacity=".95"/>
      <stop offset="55%"  stop-color="#FFEDC0" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#FFEDC0" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
